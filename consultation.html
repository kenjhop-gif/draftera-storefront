<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draftera | CX & AI Support Consulting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brandDark: '#020617', } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark'); localStorage.theme = 'light';
            } else {
                html.classList.add('dark'); localStorage.theme = 'dark';
            }
        }
        if (localStorage.theme === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
</head>
<body class="antialiased bg-slate-50 dark:bg-brandDark transition-colors duration-300">

    <nav class="sticky top-0 z-50 w-full border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-brandDark/90 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html"><span class="text-2xl font-bold tracking-tighter text-slate-900 dark:text-white">Draftera<span class="text-teal-500 dark:text-teal-400">.</span></span></a>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="toggleTheme()" class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">🌓</button>
                    <a href="index.html" class="bg-slate-900 dark:bg-white text-white dark:text-black px-6 py-2.5 rounded-full font-semibold hover:bg-slate-800 dark:hover:bg-gray-200 transition shadow-lg">Back to Product</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-24 relative overflow-hidden px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
        <div class="text-center mb-16">
            <div class="inline-block border border-teal-200 dark:border-teal-900/50 rounded-full px-4 py-1.5 text-sm text-teal-700 dark:text-teal-400 mb-6 tracking-wide font-semibold bg-teal-50 dark:bg-teal-950/20">( Strategic Advisory )</div>
            <h1 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white mb-6">Stop guessing why your AI bot is burning budget.</h1>
            <p class="text-xl text-slate-600 dark:text-slate-400">Not ready for a full analytics dashboard? Let us audit your Zendesk/Intercom instance and find the "Context-Loading" bleed for you.</p>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-2xl shadow-xl">
            <h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-6">Request an Advisory Call</h3>
            <form action="https://formspree.io/f/meergklo" method="POST" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Full Name *</label>
                    <input type="text" name="name" required class="w-full bg-slate-50 dark:bg-brandDark border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white px-4 py-3 rounded-lg focus:outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Work Email *</label>
                    <input type="email" name="email" required class="w-full bg-slate-50 dark:bg-brandDark border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white px-4 py-3 rounded-lg focus:outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Current Helpdesk Platform (e.g., Zendesk, Intercom)</label>
                    <input type="text" name="platform" class="w-full bg-slate-50 dark:bg-brandDark border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white px-4 py-3 rounded-lg focus:outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">What is your biggest AI support headache right now?</label>
                    <textarea name="comment" rows="3" class="w-full bg-slate-50 dark:bg-brandDark border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white px-4 py-3 rounded-lg focus:outline-none focus:border-teal-500"></textarea>
                </div>
                <input type="hidden" name="_replyto" value="hello@draftera.ca">
                <input type="hidden" name="form_type" value="Consulting Request">
                <button type="submit" class="w-full bg-teal-600 text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-teal-700 transition shadow-lg mt-2">Request Consultation</button>
            </form>
        </div>
    </section>

</body>
</html>
